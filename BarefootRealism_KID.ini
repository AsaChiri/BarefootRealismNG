; Barefoot Realism NG - Keyword Item Distributor config
; Requires Keyword Item Distributor (KID): https://www.nexusmods.com/skyrimspecialedition/mods/55728
;
; KID auto-creates the BarefootRealism_* keywords below if they don't already exist in the load
; order, so this works without editing BarefootRealism.esp. The mod's scripts resolve them at
; runtime via Keyword.GetKeyword("BarefootRealism_*").
;
; Filter syntax reminder:
;   - a bare token (e.g. zbfWornAnkles) is a FORM filter: "tag only records that ALREADY carry
;     this keyword".
;   - a token prefixed with * (e.g. *Shoes) is a STRING filter: case-insensitive substring match
;     against the record's name / editorID.
;   - lines that share a keyword are independent rules (OR); commas within one filter field are AND.

; --- Ankle restraints that block changing footwear ---
; Reproduces the old hardcoded zbfWornAnkles / zad_DeviousAnkleShackles checks. Add your own lines
; (one keyword per line) to cover other restraint mods.
Keyword = BarefootRealism_AnkleRestraint|Armor|zbfWornAnkles
Keyword = BarefootRealism_AnkleRestraint|Armor|zad_DeviousAnkleShackles

; --- Footwear that counts as "shoes" (allowed past ankle restraints when the MCM option is on) ---
; Reproduces the old StringUtil.Find(name, " Shoes") name match.
Keyword = BarefootRealism_Shoes|Armor|*Shoes

; --- Footwear that should COUNT AS BAREFOOT (e.g. DDx slave heels) ---
; The MCM "Set worn as barefoot exception" button needs this keyword to EXIST. KID only creates a
; keyword that appears on an ACTIVE (uncommented) line, so the line below creates it WITHOUT tagging
; anything by default: its string filter (*...placeholder...) matches no item name. Keep this line
; (or replace it with your own active BarefootRealism_BarefootException rule).
Keyword = BarefootRealism_BarefootException|Armor|*zzBarefootRealismExceptionPlaceholderzz
;
; To tag whole categories automatically, add real lines, e.g.:
;Keyword = BarefootRealism_BarefootException|Armor|*Slave Heels
;Keyword = BarefootRealism_BarefootException|Armor|zad_DeviousHeels
